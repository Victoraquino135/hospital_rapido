name: hospital_rapido

description: "Sistema de gerenciamento hospitalar Hospital Rápido."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Banco de dados local SQLite
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4

  # Caminhos dos arquivos
  path: ^1.9.1

  # Ícones e acessibilidade
  flutter_svg: ^2.0.10+1

  # Máscaras de campos (CPF, telefone, data)
  mask_text_input_formatter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png