name: ubs_saude
description: Aplicativo responsivo para a UBS Saude & Cuidado.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ubs_saude_cuidado.jpg
    - assets/images/ubs_rapida_logo.jpg
